global:
  scrape_interval: 5s          # short for the practice; 15-30s is normal
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lab14-app
    static_configs:
      - targets: ["lab14-app:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
